name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            for candidate in /usr/local/lib/android/sdk /opt/android-sdk /usr/lib/android-sdk; do
              if [ -d "$candidate" ]; then
                export ANDROID_HOME="$candidate"
                break
              fi
            done
          fi
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "Android SDK not found on runner"
            exit 1
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric dependencies
        uses: actions/cache@v4
        with:
          path: .home/.m2
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Decode release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ACTIVITYLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing ACTIVITYLOCK_KEYSTORE_BASE64 repository secret"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/activitylock.jks"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build signed release APK
        env:
          ACTIVITYLOCK_KEYSTORE_FILE: ${{ runner.temp }}/activitylock.jks
          ACTIVITYLOCK_STORE_PASSWORD: ${{ secrets.ACTIVITYLOCK_STORE_PASSWORD }}
          ACTIVITYLOCK_KEY_ALIAS: ${{ secrets.ACTIVITYLOCK_KEY_ALIAS }}
          ACTIVITYLOCK_KEY_PASSWORD: ${{ secrets.ACTIVITYLOCK_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename tagged APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/release/app-release.apk "Locky-${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Locky
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Locky-${{ github.ref_name }}.apk
            docs/Locky-Demo-16x9-1080p.mp4
            docs/Locky-Demo-Fun-16x9.mp4
          generate_release_notes: true
          fail_on_unmatched_files: true
