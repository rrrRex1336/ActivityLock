plugins {
    id 'com.android.application'
}

def releaseKeystore = System.getenv("ACTIVITYLOCK_KEYSTORE_FILE")
def hasReleaseSigning = releaseKeystore != null
        && !releaseKeystore.trim().isEmpty()
        && file(releaseKeystore).exists()

android {
    namespace 'io.kernelxtra.activitylock'
    compileSdk 35

    defaultConfig {
        applicationId "io.kernelxtra.activitylock"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.2.0"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("ACTIVITYLOCK_STORE_PASSWORD")
                keyAlias System.getenv("ACTIVITYLOCK_KEY_ALIAS")
                keyPassword System.getenv("ACTIVITYLOCK_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            doFirst {
                rootProject.file('.home').mkdirs()
            }
            systemProperty 'user.home', rootProject.file('.home').absolutePath
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
